[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "qe-framework"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",
    "pytest-html>=4.0",
    "pytest-json-report>=1.5",
    "requests>=2.31",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest-flakefinder>=1.1",
    "pytest-randomly>=3.15",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "functional: functional / acceptance tests",
    "integration: integration tests (require live services)",
    "identity: authentication and authorisation tests",
    "security: security tests",
    "data_integrity: data type and boundary tests",
    "performance: performance and load tests",
    "finance_critical: tests covering monetary, regulatory, or audit flows",
]
addopts = [
    "--tb=short",
    "--strict-markers",
]

[tool.mypy]
python_version = "3.12"
strict = true
