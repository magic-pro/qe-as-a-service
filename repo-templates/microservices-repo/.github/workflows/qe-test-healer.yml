name: QEaaS — Test Healer

on:
  workflow_run:
    workflows: ["*"]
    types: [completed]

jobs:
  heal:
    name: Analyse and heal CI failures
    runs-on: ubuntu-latest
    # Exclude the healer itself to prevent recursive triggering
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.name != 'QEaaS — Test Healer' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Download CI artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ci-output/
        continue-on-error: true

      - name: Collect failure output
        id: collect
        run: |
          {
            echo "=== TEST FAILURES ==="
            find ci-output/ -name "*.json" | xargs grep -l "FAIL\|PASS" 2>/dev/null \
              | head -3 | xargs cat 2>/dev/null || echo "No test output"

            echo "=== DATA RACE ==="
            grep -r "DATA RACE" ci-output/ 2>/dev/null | head -20 || echo "No race detected"

            echo "=== GOLANGCI-LINT ==="
            find ci-output/ -name "golangci-lint*.json" -o -name "lint*.json" \
              | head -1 | xargs cat 2>/dev/null || echo "No lint report"

            echo "=== GOSEC ==="
            find ci-output/ -name "gosec*.json" -o -name "security*.json" \
              | head -1 | xargs cat 2>/dev/null || echo "No gosec report"

            echo "=== STATICCHECK ==="
            find ci-output/ -name "staticcheck*.json" \
              | head -1 | xargs cat 2>/dev/null || echo "No staticcheck report"
          } > /tmp/failure-summary.txt

          head -500 /tmp/failure-summary.txt > /tmp/failure-truncated.txt

          echo "FAILURE_SUMMARY<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/failure-truncated.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Detect critical patterns
        id: checks
        run: |
          RACE_DETECTED=false
          FINANCE_FLAG=false

          grep -q "DATA RACE" /tmp/failure-summary.txt 2>/dev/null && RACE_DETECTED=true

          if grep -qiE "float64.*amount|float64.*balance|float64.*fee|pii|G101|G201|G202|G401|hardcode|sql.inject|NewFromFloat" \
            /tmp/failure-summary.txt 2>/dev/null; then
            FINANCE_FLAG=true
          fi

          echo "RACE_DETECTED=$RACE_DETECTED" >> $GITHUB_OUTPUT
          echo "FINANCE_FLAG=$FINANCE_FLAG" >> $GITHUB_OUTPUT

      - name: Invoke QEaaS Test Healer Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAILURE_CONTEXT: ${{ steps.collect.outputs.FAILURE_SUMMARY }}
          RACE_DETECTED: ${{ steps.checks.outputs.RACE_DETECTED }}
          FINANCE_FLAG: ${{ steps.checks.outputs.FINANCE_FLAG }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          claude -p \
            "Use the test-healer-agent subagent for this task.

             CI failure in: $WORKFLOW_NAME ($WORKFLOW_URL)
             Data race detected: $RACE_DETECTED
             Finance-critical pattern detected: $FINANCE_FLAG

             Failure output (may include test failures and/or static analysis):
             $FAILURE_CONTEXT

             Instructions:
             - Classify all findings (go test / golangci-lint / gosec / staticcheck)
             - Auto-fix safe findings (gofmt, unused imports, errcheck, bodyclose)
             - Escalate: gosec findings, finance patterns, regressions, logic bugs
             - If DATA RACE: fix synchronisation — never suppress with //nolint:govet
             - Never change decimal.Decimal to float64 to fix a failure
             - Never suppress with //nolint, //nosec without human approval
             - If finance-critical patterns found: ESCALATE before touching anything
             - Read .qe/data-type-map.md for finance context
             - Raise a PR titled [QEaaS Heal] for any fixes"
        continue-on-error: true

      - name: Flag finance-critical findings
        if: steps.checks.outputs.FINANCE_FLAG == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[QEaaS] Finance-critical pattern in CI failure — immediate review',
              body: `Finance-critical pattern detected.\n\nWorkflow: ${{ github.event.workflow_run.html_url }}\n\nPossible: float64 for monetary value, PII in logs, gosec G101/G201/G401, decimal.NewFromFloat usage.\n\n**Do not suppress — fix root cause.**`,
              labels: ['qe-healer', 'finance-critical', 'needs-attention']
            });

      - name: Flag data race
        if: steps.checks.outputs.RACE_DETECTED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[QEaaS] Data race detected — immediate review',
              body: `Go data race detected in: ${{ github.event.workflow_run.html_url }}\n\nDo not suppress. Fix the underlying synchronisation issue.`,
              labels: ['qe-healer', 'data-race', 'needs-attention']
            });

      - name: Notify on healer failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[QEaaS] Test healer failed — manual review required',
              body: `Healer could not auto-fix: ${{ github.event.workflow_run.html_url }}\n\nRun \`/heal-tests\` locally.`,
              labels: ['qe-healer', 'needs-attention']
            });
