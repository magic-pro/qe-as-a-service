services:
  qe-agents:
    profiles: ["agents"]
    build:
      context: .
      dockerfile: agent_service/Dockerfile
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      QE_AGENT_RUNTIME: ${QE_AGENT_RUNTIME:-copilot}
      COPILOT_GITHUB_TOKEN: ${COPILOT_GITHUB_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      QE_AGENT_BASE_URL: http://127.0.0.1:8083
      QE_AGENT_LOG_DIR: /home/qe/agent-logs
      QE_A2A_CLIENT_KEYS: ${QE_A2A_CLIENT_KEYS:-}
    volumes:
      - ./knowledge:/app/knowledge
      - qe-agent-logs:/home/qe/agent-logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  mock-jira:
    image: wiremock/wiremock:3.10.0
    volumes:
      - ./mocks/jira:/home/wiremock
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/__admin/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-autogentests:
    build: ./mocks/autogentests
    ports:
      - "8082:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qe-agent-logs:
