<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QEaaS Agent Twin</title>
<style>
  :root {
    --bg: #0b1020; --panel: rgba(13, 19, 38, 0.86); --line: rgba(148, 163, 184, 0.18);
    --text: #e2e8f0; --muted: #94a3b8;
    --working: #22d3ee; --waiting: #fbbf24; --done: #4ade80; --failed: #f87171; --idle: #64748b; --ended: #334155;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  header { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 14px;
    padding: 10px 16px; background: linear-gradient(var(--panel), rgba(13,19,38,0)); z-index: 2;
    transition: opacity .6s; }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .02em; white-space: nowrap; }
  header .clock { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); background: rgba(15,23,42,.7);
    font-size: 12px; white-space: nowrap; }
  .chip b { font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
  .spacer { flex: 1; }
  button { background: rgba(30,41,59,.85); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 5px 11px; font: inherit; cursor: pointer; }
  button:hover { border-color: rgba(148,163,184,.5); }
  button.on { background: #0e7490; border-color: #22d3ee; }
  #feed { position: fixed; top: 54px; right: 12px; bottom: 76px; width: 320px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; overflow-y: auto; z-index: 2;
    transition: opacity .6s; backdrop-filter: blur(6px); }
  #feed h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 2px 0 8px; }
  .ev { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .ev .meta { color: var(--muted); font-size: 11px; display: flex; gap: 6px; }
  .ev .lbl { word-break: break-word; }
  #replay { position: fixed; left: 12px; right: 12px; bottom: 12px; display: none; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; z-index: 2;
    transition: opacity .6s; }
  #replay.show { display: flex; }
  #replay input[type=range] { flex: 1; accent-color: var(--working); }
  #replay .t { font-variant-numeric: tabular-nums; min-width: 150px; text-align: right; }
  #detail { position: fixed; display: none; width: 340px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; z-index: 3; backdrop-filter: blur(6px); max-height: 60vh; overflow-y: auto; }
  #detail h3 { margin: 0 0 4px; font-size: 14px; }
  #detail .desc { color: var(--muted); margin-bottom: 8px; }
  #err { position: fixed; left: 50%; top: 60px; transform: translateX(-50%); background: #7f1d1d; padding: 6px 12px;
    border-radius: 8px; display: none; z-index: 4; }
  body.saver header, body.saver #feed, body.saver #replay { opacity: 0; pointer-events: none; }
  body.saver { cursor: none; }
  body.nofeed #feed { display: none; }
</style>
</head>
<body>
<canvas id="world"></canvas>
<header>
  <h1>🧪 QEaaS Agent Twin</h1>
  <span class="clock" id="clock"></span>
  <div class="chips" id="chips"></div>
  <span class="spacer"></span>
  <button id="btnReplay" title="R">⏪ Replay</button>
  <button id="btnFeed" class="on" title="A">Activity</button>
  <button id="btnSaver" title="F">🖥 Screensaver</button>
</header>
<aside id="feed"><h2 id="feedTitle">Live activity</h2><div id="events"></div></aside>
<div id="replay">
  <button id="btnPlay">▶</button>
  <select id="speed">
    <option value="60">60×</option><option value="600" selected>600×</option><option value="3600">3600×</option>
  </select>
  <input type="range" id="scrub" min="0" max="1000" value="1000">
  <span class="t" id="replayTime"></span>
  <button id="btnLive">Back to live</button>
</div>
<div id="detail"></div>
<div id="err"></div>
<script>
(() => {
  const COLORS = { working: '#22d3ee', waiting: '#fbbf24', done: '#4ade80', failed: '#f87171', idle: '#64748b', ended: '#334155', unknown: '#94a3b8' };
  const LABELS = { working: 'Working', waiting: 'Needs review', done: 'Done', failed: 'Failed', idle: 'Idle', ended: 'Ended', unknown: 'Unconfirmed' };
  const SOURCE = { copilot: 'Copilot hook', 'qe-manual': 'Local QE launcher', 'qe-webhook': 'Local webhook', okf: 'OKF artifact', 'log.md': 'QE change log' };
  const SOURCE_STATE = { disabled: 'Capture disabled', unobserved: 'No events observed', unavailable: 'Source unavailable', observed: 'Events observed' };
  const POLL_MS = 3000;

  const canvas = document.getElementById('world');
  const ctx = canvas.getContext('2d');
  const $ = (id) => document.getElementById(id);

  let data = null;            // last /api/state payload
  let replay = null;          // { t, playing, start, end } when in replay mode
  let rooms = [];             // hit boxes from last frame
  let selected = null;
  let saverTimer = null;
  let scrollY = 0, maxScroll = 0;
  canvas.addEventListener('wheel', (event) => {
    scrollY = Math.max(0, Math.min(maxScroll, scrollY + event.deltaY));
    event.preventDefault();
  }, { passive: false });
  const stars = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), s: Math.random() * 1.4 + .3, p: Math.random() * 6 }));

  // ------------------------------------------------------------ data
  async function poll() {
    if (replay) return;
    try {
      const res = await fetch('/api/state?hours=24', { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      data = await res.json();
      $('err').style.display = 'none';
      renderChrome();
    } catch (e) {
      $('err').textContent = 'Twin server unreachable — retrying…';
      $('err').style.display = 'block';
    }
  }

  const ms = (iso) => iso ? Date.parse(iso) : NaN;

  function hue(id) {
    let h = 0;
    for (const c of id) h = (h * 31 + c.charCodeAt(0)) % 360;
    return h;
  }

  function stateAt(lane, t) {
    let last = data.initial[lane.id] || null;
    for (const ev of data.timeline) {
      const ts = ms(ev.ts);
      if (ts > t) break;
      if (ev.lane === lane.id) last = ev;
    }
    if (!last) return { status: 'unknown', activity: 'No activity observed', since: null };
    if (last.expires && t >= ms(last.expires)) {
      return { status: 'unknown', activity: 'No recent lifecycle update', since: last.ts };
    }
    return { status: last.status, activity: last.label, since: last.ts };
  }

  function currentLanes() {
    if (!data) return [];
    if (!replay) return data.lanes;
    return data.lanes.map((l) => ({ ...l, ...stateAt(l, replay.t) }))
      .filter((l) => !l.worktree || l.since);
  }

  function nowMs() { return replay ? replay.t : Date.now(); }

  // ------------------------------------------------------------ chrome (DOM)
  function fmtTime(t) {
    return new Date(t).toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  function ago(iso) {
    if (!iso) return '';
    const s = Math.max(0, (nowMs() - ms(iso)) / 1000);
    if (s < 60) return `${Math.floor(s)}s ago`;
    if (s < 3600) return `${Math.floor(s / 60)}m ago`;
    if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
    return `${Math.floor(s / 86400)}d ago`;
  }
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function renderChrome() {
    if (!data) return;
    const lanes = currentLanes();
    const counts = {};
    lanes.forEach((l) => { counts[l.status] = (counts[l.status] || 0) + 1; });
    $('chips').innerHTML = Object.keys(LABELS)
      .filter((s) => counts[s])
      .map((s) => `<span class="chip"><span class="dot" style="background:${COLORS[s]}"></span><b>${counts[s]}</b> ${LABELS[s].toLowerCase()}</span>`)
      .join('');

    const names = Object.fromEntries(data.lanes.map((l) => [l.id, l.name]));
    const t = nowMs();
    const evs = data.timeline.filter((e) => ms(e.ts) <= t && names[e.lane]).slice(-60).reverse();
    $('feedTitle').textContent = replay ? 'Replay activity' : 'Live activity';
    $('events').innerHTML = evs.map((e) => `
      <div class="ev"><div class="meta"><span class="dot" style="background:${COLORS[e.status]}"></span>
        <span>${esc(names[e.lane])} · ${esc(SOURCE[e.source])}</span><span class="spacer"></span><span>${ago(e.ts)}</span></div>
        <div class="lbl">${esc(e.label)}</div></div>`).join('') || '<div class="ev">No activity in the last 24 hours.</div>';
    if (selected) showDetail(selected);
  }

  function showDetail(id, x, y) {
    const lane = currentLanes().find((l) => l.id === id);
    const box = $('detail');
    if (!lane) { box.style.display = 'none'; selected = null; return; }
    selected = id;
    const t = nowMs();
    const evs = data.timeline.filter((e) => e.lane === id && ms(e.ts) <= t).slice(-12).reverse();
    box.innerHTML = `<h3>${esc(lane.name)}</h3>
      <div class="desc">${esc(SOURCE[lane.scope] || lane.scope)}${lane.worktree ? ' · Worktree ' + esc(lane.worktree.slice(0, 8)) : ''}</div>
      ${lane.parent ? `<div class="desc">Parent session ${esc(lane.parent.split(':')[2].slice(0, 8))}</div>` : ''}
      <div class="desc">${esc(lane.description)}</div>
      <div><span class="dot" style="background:${COLORS[lane.status]}"></span><b>${LABELS[lane.status]}</b> — ${esc(lane.activity)} <span style="color:var(--muted)">${ago(lane.since)}</span></div>
      ${evs.map((e) => `<div class="ev"><div class="meta"><span class="dot" style="background:${COLORS[e.status]}"></span><span>${fmtTime(ms(e.ts))}</span></div><div class="lbl">${esc(e.label)}</div></div>`).join('')}`;
    if (x !== undefined) {
      box.style.left = Math.min(x + 12, innerWidth - 360) + 'px';
      box.style.top = Math.min(y + 12, innerHeight - 200) + 'px';
    }
    box.style.display = 'block';
  }

  // ------------------------------------------------------------ sky
  const SKY = [ // hour → [top, bottom]
    [0, '#020617', '#0f172a'], [5, '#0f172a', '#312e81'], [6.5, '#7c3aed', '#fb923c'], [8, '#38bdf8', '#bae6fd'],
    [16, '#0ea5e9', '#bae6fd'], [18.5, '#7c2d12', '#f97316'], [20, '#1e1b4b', '#4c1d95'], [21.5, '#020617', '#0f172a'], [24, '#020617', '#0f172a'],
  ];
  function mix(a, b, f) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const ch = (s) => Math.round(((pa >> s) & 255) * (1 - f) + ((pb >> s) & 255) * f);
    return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
  }
  function skyAt(t) {
    const d = new Date(t);
    const h = d.getHours() + d.getMinutes() / 60;
    let i = 0;
    while (i < SKY.length - 2 && SKY[i + 1][0] <= h) i++;
    const [h0, t0, b0] = SKY[i], [h1, t1, b1] = SKY[i + 1];
    const f = (h - h0) / (h1 - h0);
    const night = h < 6 || h >= 20;
    return { top: mix(t0, t1, f), bottom: mix(b0, b1, f), night, hour: h };
  }

  function drawSky(W, H, sky, time) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, sky.top); g.addColorStop(1, sky.bottom);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    if (sky.night) {
      for (const s of stars) {
        ctx.globalAlpha = .4 + .6 * Math.abs(Math.sin(time / 900 + s.p));
        ctx.fillStyle = '#fff';
        ctx.fillRect(s.x * W, s.y * H * .9, s.s, s.s);
      }
      ctx.globalAlpha = 1;
    }
    // Sun by day, moon by night, travelling across the sky.
    const p = sky.night ? ((sky.hour + 4) % 24) / 10 : (sky.hour - 6) / 14;
    const x = W * (.08 + .84 * Math.min(1, Math.max(0, p)));
    const y = H * (.75 - .55 * Math.sin(Math.PI * Math.min(1, Math.max(0, p))));
    ctx.beginPath(); ctx.arc(x, y, sky.night ? 14 : 20, 0, Math.PI * 2);
    ctx.fillStyle = sky.night ? '#e2e8f0' : '#fde047';
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 30; ctx.fill(); ctx.shadowBlur = 0;
    if (sky.night) { ctx.beginPath(); ctx.arc(x + 6, y - 4, 12, 0, Math.PI * 2); ctx.fillStyle = sky.top; ctx.fill(); }
  }

  // ------------------------------------------------------------ studios
  function roundRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function fitText(text, maxW) {
    if (ctx.measureText(text).width <= maxW) return text;
    while (text.length > 1 && ctx.measureText(text + '…').width > maxW) text = text.slice(0, -1);
    return text + '…';
  }

  function drawStudio(lane, x, y, w, h, sky, time) {
    const st = lane.status, col = COLORS[st], hu = hue(lane.id);
    const lit = st === 'working' || st === 'waiting' || st === 'done' || st === 'failed';
    const phase = (time / 1000) + hu;

    // Room shell
    roundRect(x, y, w, h, 10);
    ctx.fillStyle = sky.night && !lit ? `hsl(${hu},18%,9%)` : `hsl(${hu},${lit ? 30 : 16}%,${sky.night ? 15 : 19}%)`;
    ctx.fill();
    ctx.save(); ctx.clip();
    // Warm light spill at night when the studio is busy
    if (sky.night && lit) {
      const g = ctx.createRadialGradient(x + w * .55, y + h * .45, 4, x + w * .55, y + h * .45, w * .7);
      g.addColorStop(0, 'rgba(253, 224, 71, .18)'); g.addColorStop(1, 'rgba(253, 224, 71, 0)');
      ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    }
    // Window with sky
    const wx = x + 10, wy = y + 26, ww = w * .26, wh = h * .3;
    const sg = ctx.createLinearGradient(0, wy, 0, wy + wh);
    sg.addColorStop(0, sky.top); sg.addColorStop(1, sky.bottom);
    ctx.fillStyle = sg; ctx.fillRect(wx, wy, ww, wh);
    ctx.strokeStyle = 'rgba(226,232,240,.35)'; ctx.lineWidth = 2; ctx.strokeRect(wx, wy, ww, wh);
    ctx.beginPath(); ctx.moveTo(wx + ww / 2, wy); ctx.lineTo(wx + ww / 2, wy + wh); ctx.stroke();
    // Floor
    const fy = y + h * .72;
    ctx.fillStyle = `hsl(${hu},14%,${sky.night && !lit ? 6 : 11}%)`; ctx.fillRect(x, fy, w, h - (fy - y));

    // Desk + monitor
    const dx = x + w * .44, dw = w * .44, dy = fy - 8;
    ctx.fillStyle = '#475569'; ctx.fillRect(dx, dy, dw, 6); ctx.fillRect(dx + 4, dy + 6, 4, 14); ctx.fillRect(dx + dw - 8, dy + 6, 4, 14);
    const mw = dw * .5, mh = h * .2, mx = dx + dw * .42, my = dy - mh - 6;
    ctx.fillStyle = '#0f172a'; roundRect(mx - 3, my - 3, mw + 6, mh + 6, 3); ctx.fill();
    ctx.fillStyle = '#334155'; ctx.fillRect(mx + mw / 2 - 2, my + mh + 3, 4, 6);
    let screen = '#020617';
    if (st === 'working') screen = '#083344';
    if (st === 'waiting') screen = Math.sin(time / 300) > 0 ? '#78350f' : '#451a03';
    if (st === 'done') screen = '#052e16';
    if (st === 'failed') screen = '#450a0a';
    ctx.fillStyle = screen; ctx.fillRect(mx, my, mw, mh);
    if (st === 'working') {               // scrolling code
      ctx.fillStyle = col;
      for (let i = 0; i < 5; i++) {
        const lw = (Math.sin(i * 7.3 + Math.floor(time / 250) * 1.7 + hu) * .5 + .5) * (mw - 10) + 4;
        ctx.globalAlpha = .55; ctx.fillRect(mx + 4, my + 4 + i * (mh - 6) / 5, lw, 2);
      }
      ctx.globalAlpha = 1;
      ctx.shadowColor = col; ctx.shadowBlur = 16; ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.strokeRect(mx, my, mw, mh); ctx.shadowBlur = 0;
    } else if (st === 'done') {
      ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath();
      ctx.moveTo(mx + mw * .35, my + mh * .5); ctx.lineTo(mx + mw * .47, my + mh * .7); ctx.lineTo(mx + mw * .68, my + mh * .3); ctx.stroke();
    } else if (st === 'failed') {
      ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath();
      ctx.moveTo(mx + mw * .38, my + mh * .3); ctx.lineTo(mx + mw * .62, my + mh * .7);
      ctx.moveTo(mx + mw * .62, my + mh * .3); ctx.lineTo(mx + mw * .38, my + mh * .7); ctx.stroke();
    }

    // Agent avatar (empty chair when the session has ended)
    const ax = dx - 4, chairY = fy - 2;
    ctx.fillStyle = '#1e293b'; ctx.fillRect(ax - 12, chairY - 22, 4, 26); ctx.fillRect(ax - 12, chairY - 2, 26, 4);
    if (st !== 'ended') {
      const bob = st === 'working' ? Math.sin(phase * 8) * 1.5 : st === 'idle' ? 2 : 0;
      const body = `hsl(${hu},65%,${st === 'idle' ? 35 : 55}%)`;
      ctx.fillStyle = body; roundRect(ax - 9, chairY - 30 + bob, 18, 26, 6); ctx.fill();
      // arms typing
      ctx.strokeStyle = body; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.beginPath();
      const reach = st === 'working' ? Math.sin(phase * 14) * 3 : 0;
      ctx.moveTo(ax + 4, chairY - 22 + bob); ctx.lineTo(dx + 10 + reach, dy - 2);
      ctx.stroke(); ctx.lineCap = 'butt';
      const hy = chairY - 40 + bob + (st === 'idle' ? 4 : 0);
      if (lane.kind === 'copilot') {      // robot head with antenna
        ctx.fillStyle = '#cbd5e1'; roundRect(ax - 9, hy - 9, 18, 16, 4); ctx.fill();
        ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(ax, hy - 9); ctx.lineTo(ax, hy - 15); ctx.stroke();
        ctx.fillStyle = col; ctx.beginPath(); ctx.arc(ax, hy - 16, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#0f172a'; ctx.fillRect(ax + 1, hy - 4, 3, st === 'idle' ? 1 : 3); ctx.fillRect(ax + 6, hy - 4, 2, st === 'idle' ? 1 : 3);
      } else {                            // human-ish QE agent
        ctx.fillStyle = '#fcd9b8'; ctx.beginPath(); ctx.arc(ax, hy, 8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = `hsl(${(hu + 180) % 360},30%,25%)`; ctx.beginPath(); ctx.arc(ax, hy - 2, 8, Math.PI, 0); ctx.fill();
      }
      if (st === 'idle') {                // Z z z
        ctx.fillStyle = 'rgba(203,213,225,.7)'; ctx.font = '600 11px sans-serif';
        const k = (time / 1200 + hu) % 1;
        ctx.globalAlpha = 1 - k; ctx.fillText('z', ax + 8, hy - 10 - k * 14); ctx.globalAlpha = 1;
      }
      if (st === 'waiting') {             // speech bubble asking for you
        const bx = ax + 8, by = hy - 34, pulse = 1 + Math.sin(time / 250) * .08;
        ctx.save(); ctx.translate(bx + 12, by + 10); ctx.scale(pulse, pulse);
        ctx.fillStyle = col; roundRect(-14, -11, 28, 20, 6); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-8, 8); ctx.lineTo(-12, 15); ctx.lineTo(-2, 8); ctx.fill();
        ctx.fillStyle = '#1c1917'; ctx.font = '700 14px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('?', 0, 4);
        ctx.restore(); ctx.textAlign = 'left';
      }
      if (st === 'done') {                // little sparkle
        ctx.fillStyle = col;
        for (let i = 0; i < 3; i++) {
          const a = phase * 2 + i * 2.1;
          ctx.globalAlpha = .5 + .5 * Math.sin(a * 2);
          ctx.fillRect(ax + Math.cos(a) * 18, hy - 6 + Math.sin(a) * 12, 3, 3);
        }
        ctx.globalAlpha = 1;
      }
    }
    ctx.restore();

    // Border, name plate, status badge, activity
    roundRect(x, y, w, h, 10);
    ctx.lineWidth = selected === lane.id ? 2.5 : 1.2;
    ctx.strokeStyle = selected === lane.id ? '#e2e8f0' : (st === 'waiting' ? col : 'rgba(148,163,184,.25)');
    if (st === 'waiting') { ctx.shadowColor = col; ctx.shadowBlur = 10 + 6 * Math.sin(time / 300); }
    ctx.stroke(); ctx.shadowBlur = 0;

    ctx.font = '600 12px -apple-system, Segoe UI, sans-serif';
    const badge = LABELS[st];
    const bw = ctx.measureText(badge).width + 16;
    ctx.fillStyle = '#e2e8f0';
    ctx.fillText(fitText(lane.name, w - bw - 26), x + 10, y + 17);
    ctx.fillStyle = col; roundRect(x + w - bw - 8, y + 6, bw, 16, 8); ctx.fill();
    ctx.fillStyle = st === 'idle' || st === 'ended' ? '#e2e8f0' : '#0b1020';
    ctx.fillText(badge, x + w - bw, y + 18);

    ctx.font = '11px -apple-system, Segoe UI, sans-serif';
    ctx.fillStyle = 'rgba(226,232,240,.85)';
    ctx.fillText(fitText(lane.activity || '', w - 20), x + 10, y + h - 10);
    rooms.push({ id: lane.id, x, y, w, h });
  }

  function drawWing(title, lanes, x, y, w, cols, rw, rh, gap, sky, time) {
    ctx.font = '700 11px -apple-system, Segoe UI, sans-serif';
    ctx.fillStyle = 'rgba(226,232,240,.75)';
    ctx.fillText(title.toUpperCase(), x, y + 12);
    y += 20;
    lanes.forEach((lane, i) => {
      const c = i % cols, r = Math.floor(i / cols);
      drawStudio(lane, x + c * (rw + gap), y + r * (rh + gap), rw, rh, sky, time);
    });
    return y + Math.ceil(lanes.length / cols) * (rh + gap);
  }

  function frame(time) {
    const dpr = window.devicePixelRatio || 1;
    const W = innerWidth, H = innerHeight;
    if (canvas.width !== W * dpr || canvas.height !== H * dpr) { canvas.width = W * dpr; canvas.height = H * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (replay && replay.playing) {
      const speed = +$('speed').value;
      replay.t = Math.min(replay.end, replay.t + (time - (replay.last || time)) * speed);
      replay.last = time;
      if (replay.t >= replay.end) { replay.playing = false; $('btnPlay').textContent = '▶'; }
      syncScrub();
    }

    const sky = skyAt(nowMs());
    drawSky(W, H, sky, time);
    rooms = [];
    if (!data) { requestAnimationFrame(frame); return; }

    const lanes = currentLanes();
    const qe = lanes.filter((l) => l.kind === 'qe');
    const cp = lanes.filter((l) => l.kind === 'copilot');
    const feedW = document.body.classList.contains('nofeed') || document.body.classList.contains('saver') ? 0 : 344;
    const left = 16, top = 62, right = W - feedW - 16, bottom = H - (replay ? 80 : 16);
    const availW = Math.max(240, right - left), gap = 12;
    const cols = Math.max(1, Math.min(6, Math.floor((availW + gap) / (210 + gap))));
    const rw = (availW - gap * (cols - 1)) / cols;
    const rows = Math.ceil(qe.length / cols) + Math.max(1, Math.ceil(cp.length / cols));
    const rh = Math.max(110, Math.min(rw * .62, (bottom - top - 2 * 26 - rows * gap) / rows));

    maxScroll = Math.max(0, rows * (rh + gap) + 60 - (bottom - top));
    scrollY = Math.min(maxScroll, scrollY);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, top, W, Math.max(0, bottom - top)); ctx.clip();
    const qeStatus = replay ? '' : ` · ${SOURCE_STATE[data.sources.qe]}`;
    const cpStatus = replay ? '' : ` · ${SOURCE_STATE[data.sources.copilot]}`;
    let y = drawWing(`QE studios (${qe.length})${qeStatus}`, qe, left, top - scrollY, availW, cols, rw, rh, gap, sky, time);
    y += 6;
    if (cp.length) {
      drawWing(`GitHub Copilot studios (${cp.length})${cpStatus}`, cp, left, y, availW, cols, rw, rh, gap, sky, time);
    } else {
      ctx.font = '700 11px sans-serif'; ctx.fillStyle = 'rgba(226,232,240,.75)';
      ctx.fillText('GITHUB COPILOT SESSIONS', left, y + 12);
      ctx.font = '12px sans-serif'; ctx.fillStyle = 'rgba(226,232,240,.6)';
      ctx.fillText(replay ? 'No Copilot events yet in this replay.' : SOURCE_STATE[data.sources.copilot], left, y + 36);
    }
    ctx.restore();
    requestAnimationFrame(frame);
  }

  // ------------------------------------------------------------ replay
  function syncScrub() {
    const f = (replay.t - replay.start) / (replay.end - replay.start);
    $('scrub').value = Math.round(f * 1000);
    $('replayTime').textContent = fmtTime(replay.t);
    if (!syncScrub.n || ++syncScrub.n % 10 === 0) renderChrome();
    syncScrub.n = syncScrub.n || 1;
  }
  function enterReplay() {
    if (!data) return;
    const start = ms(data.windowStart), end = ms(data.generatedAt);
    replay = { start, end, t: start, playing: true, last: null };
    $('replay').classList.add('show'); $('btnReplay').classList.add('on'); $('btnPlay').textContent = '⏸';
    syncScrub(); renderChrome();
  }
  function exitReplay() {
    replay = null;
    $('replay').classList.remove('show'); $('btnReplay').classList.remove('on');
    poll();
  }

  $('btnReplay').onclick = () => (replay ? exitReplay() : enterReplay());
  $('btnLive').onclick = exitReplay;
  $('btnPlay').onclick = () => {
    if (!replay) return;
    if (replay.t >= replay.end) replay.t = replay.start;
    replay.playing = !replay.playing; replay.last = null;
    $('btnPlay').textContent = replay.playing ? '⏸' : '▶';
  };
  $('scrub').oninput = (e) => {
    if (!replay) return;
    replay.t = replay.start + (replay.end - replay.start) * (+e.target.value / 1000);
    $('replayTime').textContent = fmtTime(replay.t); renderChrome();
  };

  // ------------------------------------------------------------ screensaver + input
  function toggleFeed() {
    document.body.classList.toggle('nofeed');
    $('btnFeed').classList.toggle('on', !document.body.classList.contains('nofeed'));
  }
  function toggleSaver() {
    const on = !document.fullscreenElement;
    if (on) document.documentElement.requestFullscreen?.().catch(() => {});
    else document.exitFullscreen?.();
    document.body.classList.toggle('saver', on);
  }
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) document.body.classList.remove('saver');
  });
  // In fullscreen, reveal the controls on mouse movement and hide them again after 4 s.
  addEventListener('mousemove', () => {
    if (!document.fullscreenElement) return;
    document.body.classList.remove('saver');
    clearTimeout(saverTimer);
    saverTimer = setTimeout(() => document.fullscreenElement && document.body.classList.add('saver'), 4000);
  });
  $('btnFeed').onclick = toggleFeed;
  $('btnSaver').onclick = toggleSaver;
  addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.key === 'f' || e.key === 'F') toggleSaver();
    if (e.key === 'r' || e.key === 'R') (replay ? exitReplay() : enterReplay());
    if (e.key === 'a' || e.key === 'A') toggleFeed();
    if (e.key === ' ' && replay) { e.preventDefault(); $('btnPlay').click(); }
    if (e.key === 'Escape') { $('detail').style.display = 'none'; selected = null; }
  });
  canvas.addEventListener('click', (e) => {
    const hit = rooms.find((r) => e.clientX >= r.x && e.clientX <= r.x + r.w && e.clientY >= r.y && e.clientY <= r.y + r.h);
    if (hit) showDetail(hit.id, e.clientX, e.clientY);
    else { $('detail').style.display = 'none'; selected = null; }
  });
  canvas.addEventListener('mousemove', (e) => {
    canvas.style.cursor = rooms.some((r) => e.clientX >= r.x && e.clientX <= r.x + r.w && e.clientY >= r.y && e.clientY <= r.y + r.h) ? 'pointer' : 'default';
  });

  if (innerWidth < 900) toggleFeed();   // small screens: studios first, feed on demand
  setInterval(() => { $('clock').textContent = fmtTime(nowMs()); }, 500);
  setInterval(poll, POLL_MS);
  setInterval(() => { if (!replay) renderChrome(); }, 15000);
  poll();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
