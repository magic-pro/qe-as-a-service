name: QEaaS — Planning Agent (JIRA trigger)

on:
  workflow_dispatch:
    inputs:
      jira_key:
        description: 'Jira story key to analyse (e.g. ABC-123)'
        required: true
      use_mocks:
        description: 'Use mock JIRA + autogentests services (true/false)'
        required: false
        default: 'true'

jobs:
  plan:
    name: Planning Agent — ${{ github.event.inputs.jira_key }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set service URLs
        id: urls
        env:
          USE_MOCKS: ${{ github.event.inputs.use_mocks }}
        run: |
          if [ "$USE_MOCKS" = "true" ]; then
            echo "jira_url=http://localhost:8081" >> $GITHUB_OUTPUT
            echo "autogentests_url=http://localhost:8082" >> $GITHUB_OUTPUT
            # Dummy token — WireMock does not check Authorization
            echo "jira_token=dXNlcjpwYXNz" >> $GITHUB_OUTPUT
          else
            echo "jira_url=${{ secrets.JIRA_BASE_URL }}" >> $GITHUB_OUTPUT
            echo "autogentests_url=${{ secrets.AUTOGENTESTS_URL }}" >> $GITHUB_OUTPUT
            echo "jira_token=${{ secrets.JIRA_TOKEN }}" >> $GITHUB_OUTPUT
          fi

      - name: Start mock services
        if: github.event.inputs.use_mocks == 'true'
        run: |
          docker compose up -d
          echo "Waiting for mock services to be healthy..."
          timeout 60 bash -c '
            until curl -sf http://localhost:8081/__admin/health && \
                  python3 -c "import urllib.request; urllib.request.urlopen(\"http://localhost:8082/health\")" 2>/dev/null; do
              echo "  still waiting..."
              sleep 3
            done
          '
          echo "Mock services ready."

      - name: Run Planning Agent
        uses: anthropics/claude-code-action@v1
        with:
          prompt: >
            Analyse the Jira story in env var JIRA_KEY and produce all four QE artifacts.
            Run Step -1 first to fetch the story and RAG context before any analysis.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
        env:
          JIRA_KEY: ${{ github.event.inputs.jira_key }}
          JIRA_BASE_URL: ${{ steps.urls.outputs.jira_url }}
          JIRA_TOKEN: ${{ steps.urls.outputs.jira_token }}
          AUTOGENTESTS_URL: ${{ steps.urls.outputs.autogentests_url }}

      - name: Upload QE artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qe-maps-${{ github.event.inputs.jira_key }}-${{ github.run_id }}
          path: |
            artifacts/test-strategy.md
            artifacts/infra-map.md
          retention-days: 30
          if-no-files-found: warn

      - name: Post summary to workflow
        if: always()
        env:
          JIRA_KEY: ${{ github.event.inputs.jira_key }}
        run: |
          echo "## QEaaS Planning Agent — $JIRA_KEY" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f artifacts/test-strategy.md ]; then
            echo "### Test Strategy (first 80 lines)" >> $GITHUB_STEP_SUMMARY
            head -80 artifacts/test-strategy.md >> $GITHUB_STEP_SUMMARY
          else
            echo ":warning: No test-strategy.md produced." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Stop mock services
        if: always() && github.event.inputs.use_mocks == 'true'
        run: docker compose down
